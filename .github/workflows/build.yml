name: build-and-release

# tag 推送（如 v0.1.0）触发构建并自动发布 Release；main 分支的普通推送只构建不发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 创建 GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @electron/rebuild >= 4.2.0 / node-abi >= 4.33 require node >= 22.12.0;
          # Node 20 fails with a silent rebuilder crash right after native deps.
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Ensure electron binary (allow-scripts strips postinstall)
        shell: pwsh
        run: |
          # npm 11 allow-scripts 策略会在 npm ci 时剥离 electron 的 postinstall,
          # 导致二进制缺失;这里直接从镜像下载 electron zip 解压到 dist/
          $dist = "node_modules\electron\dist"
          if (Test-Path "$dist\electron.exe") {
            Write-Host "electron binary already present"
          } else {
            $ver = (Get-Content node_modules\electron\package.json | ConvertFrom-Json).version
            Write-Host "Downloading electron $ver binary..."
            New-Item -ItemType Directory -Path $dist -Force | Out-Null
            $zip = "$env:TEMP\electron-$ver.zip"
            Invoke-WebRequest -Uri "https://npmmirror.com/mirrors/electron/$ver/electron-v$ver-win32-x64.zip" -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $dist -Force
            Remove-Item $zip -Force
            # 标记版本文件(install.js 会写)
            Set-Content -Path "$dist\version" -Value $ver
          }
          Test-Path "$dist\electron.exe"

      - name: Prepare vendor (bundled node + dsh)
        shell: pwsh
        run: |
          # vendor/ 被 .gitignore 排除,CI 需自行准备:
          #   1) Node 便携版(与构建所需版本一致)
          #   2) @deepseek-ai/dsh 完整依赖树(安装到临时全局再复制)
          $nodeVer = (node --version).TrimStart('v')
          Write-Host "Preparing vendor with node $nodeVer ..."
          New-Item -ItemType Directory -Path vendor -Force | Out-Null
          # 下载 Node 便携版 zip 并解压
          $nodeZip = "https://registry.npmmirror.com/-/binary/node/v$nodeVer/node-v$nodeVer-win-x64.zip"
          Invoke-WebRequest -Uri $nodeZip -OutFile "$env:TEMP\node.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP\node.zip" -DestinationPath vendor\node-tmp -Force
          Move-Item "vendor\node-tmp\node-v$nodeVer-win-x64" "vendor\node"
          Remove-Item "vendor\node-tmp" -Recurse -Force
          Remove-Item "$env:TEMP\node.zip" -Force
          # 安装 dsh 到临时前缀,再把 node_modules 复制为 vendor/dsh
          # --allow-scripts 放行 koffi/node-pty 等原生模块的 postinstall 构建
          $prefix = Join-Path $env:TEMP "dsh-prefix"
          $allow = "koffi,node-pty,@deepseek-ai/dsh-subprocess-local,@google/genai,protobufjs"
          npm install -g @deepseek-ai/dsh --prefix $prefix --no-fund --no-audit --allow-scripts=$allow
          $dshSrc = Join-Path $prefix "node_modules\@deepseek-ai\dsh"
          Copy-Item $dshSrc "vendor\dsh" -Recurse -Force
          Write-Host "vendor ready:"
          Get-ChildItem vendor | Select-Object Name

      - name: Generate icons
        run: npm run icon

      - name: Build (portable + nsis)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          DEBUG: electron-builder*
        shell: pwsh
        run: |
          Write-Host "::warning::env: node=$(node --version) npm=$(npm --version)"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "::warning::env: OS=$($os.Caption) build=$($os.BuildNumber)"
          $mem = Get-CimInstance Win32_OperatingSystem
          Write-Host "::warning::env: FreeMem=$([math]::Round($mem.FreePhysicalMemory/1048576,2))GB"
          $disk = Get-PSDrive C
          Write-Host "::warning::env: C_free=$([math]::Round($disk.Free/1GB,2))GB"
          $eb = Get-Content node_modules\electron-builder\package.json | ConvertFrom-Json
          $r  = Get-Content node_modules\@electron\rebuild\package.json | ConvertFrom-Json
          $na = Get-Content node_modules\node-abi\package.json | ConvertFrom-Json
          Write-Host "::warning::env: electron-builder=$($eb.version) @electron/rebuild=$($r.version) node-abi=$($na.version)"
          # electron-builder 的 DEBUG 输出进 stderr;Tee 合并到文件 + stdout,保证文件一定存在
          npm run dist 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          Write-Host "::warning::BUILD_EXIT=$code"
          if ($code -ne 0) {
            Write-Host "::warning::build-output.log lines: $((Get-Content build-output.log).Count)"
            $lines = @(Get-Content build-output.log)
            $total = $lines.Count
            for ($i = 4; $i -ge 0; $i--) {
              $end = $total - ($i * 200)
              $start = [math]::Max(0, $end - 200)
              if ($start -ge $total) { continue }
              $seg = $lines[$start..([math]::Min($total - 1, $end - 1))] -join "`n"
              Write-Host "::error::--- seg$i lines $($start+1)-$end ---"
              Write-Host $seg
            }
            exit $code
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build-output.log
          retention-days: 14

      - name: Package launcher zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $staging = "dist\pack-temp\DeepSeek-Harness-Desktop-$version"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "dist\DeepSeek-Harness-Desktop-$version-portable.exe" $staging
          Copy-Item "launcher\launcher.ps1" $staging
          Copy-Item "launcher\启动.bat" $staging
          Copy-Item "launcher\创建桌面快捷方式.bat" $staging
          Copy-Item "launcher\使用说明.txt" $staging
          Compress-Archive -Path $staging -DestinationPath "dist\DeepSeek-Harness-Desktop-$version-便携包.zip"
          Remove-Item "dist\pack-temp" -Recurse -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Add-Content dist\SHA256SUMS.txt
          }
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Add-Content dist\SHA256SUMS.txt
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      # 仅 tag 推送时发布 Release
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
